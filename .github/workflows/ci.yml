name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # data/info.ts is gitignored; use the example for CI
      - run: cp data/info.example.ts data/info.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
